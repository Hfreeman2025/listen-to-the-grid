name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Nothing here needs the network beyond npm, and nothing asks NESO: the unit
# tests use the bundled recorded day and figures written into them. The browser
# suites (npm run shots, radio:check, perf and silence) drive real Chromium,
# WebKit and Firefox against NESO's live figures, and the silence check reads
# macOS power assertions, so they run locally, one browser at a time, and are
# not part of CI.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Build the page
        run: npm run build
      - name: Build the radio
        run: npm run build:radio
      - name: Dependency licences (MIT, Apache-2.0, BSD, ISC only)
        run: npm run licences
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
